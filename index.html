<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="arcade">
    <h1>Python.exe</h1>

    <div class="hud">
      <div>
        <span class="label">SCORE</span>
        <span class="value" id="score">0</span>
      </div>
      <div>
        <span class="label">BEST</span>
        <span class="value" id="best">0</span>
      </div>
      <div>
        <span class="label">LEVEL</span>
        <span class="value" id="level">1</span>
      </div>
      <button class="mute-btn" id="muteBtn" title="Mute sound">🔊</button>
    </div>

    <div class="board-wrap">
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay show" id="overlay">
        <h2 id="overlayTitle">Ready?</h2>
        <p id="overlayText">Arrow keys or WASD to move. Eat the berries, don't bite yourself.</p>
        <div class="snake-color-picker" id="snakeColorPicker">
          <span class="picker-label">Snake colour</span>
          <div class="swatch-row">
            <button class="color-swatch" data-color="red" style="--swatch: #FF5C5C" aria-label="Red snake"></button>
            <button class="color-swatch" data-color="blue" style="--swatch: #4DA3FF" aria-label="Blue snake"></button>
            <button class="color-swatch" data-color="yellow" style="--swatch: #FFDD57" aria-label="Yellow snake"></button>
          </div>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" type="button">🌙 Dark</button>
        <button id="startBtn">Start Game</button>
      </div>
    </div>

    <p class="controls-hint">Arrow keys / WASD to steer &middot; Space to pause &middot; swipe on mobile</p>

    <div class="dpad" id="dpad">
      <span></span>
      <button data-dir="up">&#9650;</button>
      <span></span>
      <button data-dir="left">&#9664;</button>
      <span></span>
      <button data-dir="right">&#9654;</button>
      <span></span>
      <button data-dir="down">&#9660;</button>
      <span></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
