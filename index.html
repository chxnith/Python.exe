<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python.exe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hud-corner hud-left">
    <span class="hud-crown">&#128081;</span>
    <div class="hud-stat">
      <span class="hud-label">BEST SCORE</span>
      <span class="hud-value" id="best">0</span>
    </div>
    <span class="hud-divider"></span>
    <div class="hud-stat">
      <span class="hud-label">YOUR SCORE</span>
      <span class="hud-value" id="score">0</span>
    </div>
    <span class="hud-hidden-level" id="level" hidden>1</span>
  </div>

  <div class="hud-corner hud-right">
    <div class="quick-swatch-row" id="quickSwatchRow"></div>
    <span class="hud-divider"></span>
    <button class="icon-circle" id="themeToggleBtn" title="Toggle dark / light mode">&#127769;</button>
  </div>

  <div class="arcade">
    <div class="title-block">
      <h1 class="game-logo">
        <span class="logo-crown">&#128081;</span>
        <span class="logo-title-row">
          <span class="logo-line">Python</span><span class="logo-line logo-line-2">.exe</span>
        </span>
        <span class="logo-sparkle">&#10022;</span>
      </h1>
      <p class="tagline">EAT <span class="dot">&bull;</span> GROW <span class="dot">&bull;</span> BE THE LONGEST</p>
    </div>

    <div class="board-wrap">
      <canvas id="game" width="480" height="480"></canvas>

      <div class="overlay show" id="overlay">
        <h2 class="overlay-heading">
          <span class="leaf-accent">&#10148;</span>
          <span id="overlayTitle">Ready to slither?</span>
          <span class="leaf-accent flip">&#10148;</span>
        </h2>
        <p id="overlayText">Grab some food, avoid the walls and beat your high score!</p>

        <button class="btn-primary" id="startBtn">
          <span class="play-icon">&#9654;</span> Start Game <span class="chevron">&#8250;</span>
        </button>

        <button class="option-row" id="darkModeRow" type="button">
          <span class="option-left"><span class="option-icon">&#127769;</span> Dark Mode</span>
          <span class="switch" id="darkModeSwitch"><span class="switch-thumb"></span></span>
        </button>

        <button class="option-row" id="changeColourBtn" type="button">
          <span class="option-left"><span class="option-icon">&#127912;</span> Change Colour</span>
          <span class="chevron">&#8250;</span>
        </button>
      </div>
    </div>

    <p class="controls-hint">Arrow keys / WASD to steer &middot; Space to pause &middot; swipe on mobile</p>

    <div class="dpad" id="dpad">
      <span></span>
      <button data-dir="up">&#9650;</button>
      <span></span>
      <button data-dir="left">&#9664;</button>
      <span></span>
      <button data-dir="right">&#9654;</button>
      <span></span>
      <button data-dir="down">&#9660;</button>
      <span></span>
    </div>
  </div>

  <button class="icon-square corner-btn corner-btn-left" id="trophyBtn" title="Best score">&#127942;</button>
  <button class="icon-square corner-btn corner-btn-right" id="settingsBtn" title="Sound">&#9881;&#65039;</button>

  <div class="color-modal-backdrop" id="colorModalBackdrop">
    <div class="color-modal">
      <div class="color-modal-header">
        <span>Snake Colour</span>
        <button class="color-modal-close" id="colorModalClose" type="button" aria-label="Close">&#10005;</button>
      </div>
      <div class="color-modal-grid" id="colorModalGrid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
