<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python.exe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="arcade">
    <div class="title-block">
      <h1><span class="dot">&bull;</span> <span class="accent-text">Python</span>.exe <span class="dot">&bull;</span></h1>
      <p class="tagline"><span class="dot">&bull;</span> Classic game. Modern vibes. <span class="dot">&bull;</span></p>
    </div>

    <div class="hud">
      <div>
        <span class="label">SCORE</span>
        <span class="value" id="score">0</span>
      </div>
      <div>
        <span class="label">BEST <span class="crown">&#128081;</span></span>
        <span class="value" id="best">0</span>
      </div>
      <div>
        <span class="label">LEVEL</span>
        <span class="value" id="level">1</span>
      </div>
      <button class="mute-btn" id="muteBtn" title="Mute sound">
        <svg class="bars-icon" viewBox="0 0 24 24" width="14" height="14">
          <rect x="3" y="12" width="4" height="9" rx="1"></rect>
          <rect x="10" y="7" width="4" height="14" rx="1"></rect>
          <rect x="17" y="2" width="4" height="19" rx="1"></rect>
        </svg>
      </button>
    </div>

    <div class="board-wrap">
      <div class="pedestal">
        <div class="pedestal-glow"></div>
        <div class="pedestal-ring"></div>
        <div class="pedestal-ticks"></div>
      </div>
      <canvas id="game" width="480" height="480"></canvas>
      <div class="overlay show" id="overlay">
        <h2 class="overlay-heading">
          <span class="h-line"></span>
          <span class="dot">&bull;</span>
          <span id="overlayTitle">Ready?</span>
          <span class="dot">&bull;</span>
          <span class="h-line"></span>
        </h2>
        <p id="overlayText">Arrow keys or WASD to move. Eat the coins, don't bite yourself.</p>

        <button class="theme-toggle" id="snakeColorBtn" type="button">
          <span class="swatch-preview" id="swatchPreview" style="--swatch: #35E6A0"></span>
          Snake Colour
        </button>

        <button class="theme-toggle" id="themeToggleBtn" type="button">&#127769; Dark</button>
        <button class="btn-primary" id="startBtn"><span class="play-icon">&#9654;</span> Start Game</button>
      </div>
    </div>

    <p class="controls-hint">Arrow keys / WASD to steer &middot; Space to pause &middot; swipe on mobile</p>

    <div class="dpad" id="dpad">
      <span></span>
      <button data-dir="up">&#9650;</button>
      <span></span>
      <button data-dir="left">&#9664;</button>
      <span></span>
      <button data-dir="right">&#9654;</button>
      <span></span>
      <button data-dir="down">&#9660;</button>
      <span></span>
    </div>
  </div>

  <button class="icon-btn corner-btn corner-btn-left" id="resetBestBtn" title="Reset best score" aria-label="Reset best score">&#127942;</button>
  <button class="icon-btn corner-btn corner-btn-right" title="Settings">&#9881;&#65039;</button>

  <div class="color-modal-backdrop" id="colorModalBackdrop">
    <div class="color-modal">
      <div class="color-modal-header">
        <span>Snake Colour</span>
        <button class="color-modal-close" id="colorModalClose" type="button" aria-label="Close">&#10005;</button>
      </div>
      <div class="color-modal-grid" id="colorModalGrid"></div>
    </div>
  </div>

  <div class="color-modal-backdrop" id="colorModalBackdrop">
    <div class="color-modal">
      <div class="color-modal-header">
        <span>&#127912; Snake Colour</span>
        <button class="color-modal-close" id="colorModalClose" aria-label="Close">&times;</button>
      </div>
      <div class="color-modal-grid" id="colorModalGrid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
